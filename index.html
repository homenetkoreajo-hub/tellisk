<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>정보통신설비 성능점검</title>
<style>
:root{
  --ink:#101828; --ink2:#475467; --ink3:#98a2b3;
  --line:#e4e7ec; --line2:#eef1f4; --bg:#f6f7f9; --card:#ffffff;
  --navy:#1f3f66; --navy-d:#152c48; --navy-l:#eaf0f7;
  --good:#0f9d58; --good-bg:#e7f5ee; --good-line:#9bd6b4;
  --bad:#d64545; --bad-bg:#fbeaea; --bad-line:#eaa3a3;
  --amber:#b7791f; --amber-bg:#fff7e6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow2:0 8px 24px rgba(16,24,40,.12);
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px}
.hide{display:none!important}

/* ===== top bar ===== */
.appbar{
  position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
}
.appbar .back{width:34px;height:34px;border-radius:9px;display:none;
  align-items:center;justify-content:center;background:rgba(255,255,255,.14);font-size:20px;flex:0 0 auto}
.appbar h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.2px;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar .sub{font-size:11px;opacity:.7;font-weight:500}
.appbar .tools{display:flex;gap:6px;flex:0 0 auto}
.appbar .tools button{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center}
.appbar .tools button:active{background:rgba(255,255,255,.28)}
.appbar svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:840px;margin:0 auto;padding:16px}

/* ===== dashboard ===== */
.site-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.site-card h2{margin:0 0 12px;font-size:13px;color:var(--ink2);font-weight:700;letter-spacing:.02em;
  display:flex;align-items:center;gap:7px}
.site-card h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--navy)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:11px;color:var(--ink3);margin:0 0 4px;font-weight:600}
.field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:#fcfcfd;color:var(--ink);transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--navy);background:#fff}
.field.full{grid-column:1/-1}

.summary{background:linear-gradient(135deg,var(--navy),var(--navy-d));color:#fff;border-radius:var(--r);
  padding:18px;margin-bottom:14px;box-shadow:var(--shadow2);position:relative;overflow:hidden}
.summary::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
  background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%)}
.summary .prog-top{display:flex;align-items:center;gap:16px}
.ring{width:72px;height:72px;flex:0 0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;letter-spacing:-.5px}
.summary .stitle{font-size:12px;opacity:.75;font-weight:600;margin-bottom:2px}
.summary .sbig{font-size:20px;font-weight:800;letter-spacing:-.4px}
.chips{display:flex;gap:8px;margin-top:14px;position:relative}
.chip{flex:1;background:rgba(255,255,255,.12);border-radius:11px;padding:9px 6px;text-align:center}
.chip b{display:block;font-size:19px;font-weight:800;line-height:1.1}
.chip span{font-size:10.5px;opacity:.8;font-weight:600}
.chip.good b{color:#7ee0a8}.chip.bad b{color:#ff9d9d}.chip.non b{color:#d8dee6}

.list-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
.list-head h2{font-size:13px;color:var(--ink2);font-weight:700;margin:0}
.list-head .lgnd{display:flex;gap:12px;font-size:11px;color:var(--ink3)}
.list-head .lgnd i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}

.eq{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:8px;
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-left:3px solid var(--line);
  transition:transform .08s}
.eq:active{transform:scale(.994)}
.eq .no{font-size:11px;font-weight:800;color:var(--ink3);width:22px;flex:0 0 auto}
.eq .body{flex:1;min-width:0}
.eq .nm{font-size:14.5px;font-weight:700;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq .meta{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:8px}
.bar{height:5px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .3s}
.eq.done{border-left-color:var(--good)}
.eq.done .bar>i{background:var(--good)}
.eq.hasbad{border-left-color:var(--bad)}
.eq .badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;flex:0 0 auto}
.eq .badge.b{background:var(--bad-bg);color:var(--bad)}
.eq .badge.d{background:var(--good-bg);color:var(--good)}
.eq .chev{color:var(--ink3);flex:0 0 auto}
.eq .chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* ===== inspection view ===== */
.eq-meta{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.eq-meta .fgrid{grid-template-columns:1fr 1fr}
.progress-inline{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress-inline .bar{flex:1;height:7px;margin:0}
.progress-inline .t{font-size:12px;font-weight:700;color:var(--ink2);flex:0 0 auto}

.item{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;
  overflow:hidden;border-left:3px solid var(--line)}
.item.good{border-left-color:var(--good)}
.item.bad{border-left-color:var(--bad)}
.item .top{padding:13px 14px 12px}
.item .qno{font-size:10.5px;font-weight:800;color:var(--ink3);letter-spacing:.04em}
.item .q{font-size:14.5px;font-weight:700;letter-spacing:-.2px;margin:3px 0 0}
.item .how{margin-top:9px;font-size:12.5px;color:var(--ink2);line-height:1.55;
  background:var(--navy-l);border-radius:var(--r-sm);padding:9px 11px}
.item .how b{color:var(--navy);font-weight:700;font-size:11px;display:block;margin-bottom:2px;letter-spacing:.02em}
.toggle{display:flex;gap:8px;padding:0 14px 12px}
.tg{flex:1;padding:11px;border-radius:var(--r-sm);border:1.5px solid var(--line);
  font-size:14px;font-weight:700;color:var(--ink2);background:#fcfcfd;display:flex;align-items:center;
  justify-content:center;gap:6px;transition:all .12s}
.tg:active{transform:scale(.97)}
.tg.on-good{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.tg.on-bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.tg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4}
.note-in{margin:0 14px 13px}
.note-in input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fcfcfd;font-size:14px}
.note-in input:focus{outline:none;border-color:var(--navy);background:#fff}
.note-in input::placeholder{color:var(--ink3)}

.action-box{background:var(--amber-bg);border:1px solid #f2e2bf;border-radius:var(--r);padding:14px;margin:14px 0 4px}
.action-box label{font-size:12px;font-weight:700;color:var(--amber);display:block;margin-bottom:8px}
.action-box textarea{width:100%;min-height:80px;padding:10px 12px;border:1px solid #eaddc0;border-radius:var(--r-sm);
  background:#fffdf8;resize:vertical;font-size:14px;line-height:1.55}
.action-box textarea:focus{outline:none;border-color:var(--amber)}

/* ===== report ===== */
.rep-summary{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.rep-summary .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.rep-summary .head h2{margin:0;font-size:17px;font-weight:800}
.rep-summary .head .date{font-size:12px;color:var(--ink3);text-align:right}
.rep-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.rep-kv dt{color:var(--ink3);font-weight:600}
.rep-kv dd{margin:0;font-weight:600}
.rep-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rep-stats .s{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 6px;text-align:center}
.rep-stats .s b{display:block;font-size:22px;font-weight:800}
.rep-stats .s span{font-size:11px;color:var(--ink3);font-weight:600}
.rep-stats .s.good b{color:var(--good)}.rep-stats .s.bad b{color:var(--bad)}.rep-stats .s.non b{color:var(--ink3)}

.rep-sec-h{font-size:13px;font-weight:800;color:var(--ink2);margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.rep-sec-h .cnt{font-size:11px;font-weight:800;color:#fff;background:var(--bad);border-radius:99px;padding:1px 8px}
.bad-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px;margin-bottom:8px;border-left:3px solid var(--bad)}
.bad-card .eqn{font-size:11px;font-weight:700;color:var(--bad)}
.bad-card .it{font-size:14px;font-weight:700;margin:2px 0 4px}
.bad-card .nt{font-size:12.5px;color:var(--ink2)}
.bad-card .nt em{color:var(--ink3);font-style:normal}
.empty{text-align:center;padding:34px 16px;color:var(--ink3);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.empty .ic{font-size:30px;margin-bottom:8px}

/* ===== bottom nav ===== */
.tabbar{position:sticky;bottom:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;
  color:var(--ink3);font-size:10.5px;font-weight:700;border-radius:10px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--navy)}
.tabbar button .nbadge{position:absolute;transform:translate(14px,-4px);background:var(--bad);color:#fff;
  font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}

.btn-row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:var(--r-sm);font-weight:700;font-size:14px;display:flex;
  align-items:center;justify-content:center;gap:7px;transition:all .12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--navy);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink2);border:1px solid var(--line)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:50;display:flex;align-items:flex-end;
  justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.on .sheet{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;background:var(--line);border-radius:99px;margin:8px auto 14px}
.sheet h3{margin:0 0 4px;font-size:16px;font-weight:800}
.sheet p{margin:0 0 14px;font-size:13px;color:var(--ink2)}
.sheet .opt{display:flex;align-items:center;gap:12px;padding:13px 6px;border-top:1px solid var(--line2);font-size:14.5px;font-weight:600}
.sheet .opt svg{width:20px;height:20px;stroke:var(--navy);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sheet .opt.danger{color:var(--bad)} .sheet .opt.danger svg{stroke:var(--bad)}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:99px;z-index:60;opacity:0;
  pointer-events:none;transition:all .25s;box-shadow:var(--shadow2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== print ===== */
@media print{
  body{background:#fff}
  .appbar,.tabbar,.tabbar *,.btn-row,.no-print{display:none!important}
  .wrap{max-width:none;padding:0}
  #v-report{display:block!important}
  .rep-summary,.bad-card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .item,.eq{break-inside:avoid}
}
@media (min-width:560px){.eq-meta .fgrid{grid-template-columns:1fr 1fr 1fr 1fr}}
</style>
</head>
<body>

<div class="appbar">
  <button class="back" id="backBtn" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div style="flex:1;min-width:0">
    <h1 id="barTitle">정보통신설비 성능점검</h1>
    <div class="sub" id="barSub">현장 점검 · 자동 저장</div>
  </div>
  <div class="tools">
    <button id="printBtn" aria-label="인쇄"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg></button>
    <button id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </div>
</div>

<div class="wrap">
  <!-- DASHBOARD -->
  <div id="v-dash">
    <div class="site-card">
      <h2><span class="dot"></span>현장 정보</h2>
      <div class="fgrid">
        <div class="field"><label>상호(명칭)</label><input id="f_site" placeholder="○○빌딩"></div>
        <div class="field"><label>점검자</label><input id="f_inspector" placeholder="홍길동"></div>
        <div class="field full"><label>현장주소</label><input id="f_addr" placeholder="서울시 ..."></div>
        <div class="field"><label>관리주체(입회자)</label><input id="f_attendee" placeholder="관리사무소"></div>
        <div class="field"><label>점검일자</label><input id="f_date" type="date"></div>
      </div>
    </div>

    <div class="summary">
      <div class="prog-top">
        <div class="ring">
          <svg width="72" height="72" viewBox="0 0 72 72">
            <circle cx="36" cy="36" r="30" stroke="rgba(255,255,255,.18)" stroke-width="8" fill="none"/>
            <circle id="ringFg" cx="36" cy="36" r="30" stroke="#7ee0a8" stroke-width="8" fill="none"
              stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
          </svg>
          <div class="pct" id="ringPct">0%</div>
        </div>
        <div>
          <div class="stitle">전체 점검 진행률</div>
          <div class="sbig" id="progText">0 / 323 항목</div>
        </div>
      </div>
      <div class="chips">
        <div class="chip good"><b id="cGood">0</b><span>양호</span></div>
        <div class="chip bad"><b id="cBad">0</b><span>불량</span></div>
        <div class="chip non"><b id="cNon">323</b><span>미점검</span></div>
      </div>
    </div>

    <div class="list-head">
      <h2>설비 목록 · 34개</h2>
      <div class="lgnd"><span><i style="background:var(--good)"></i>완료</span><span><i style="background:var(--bad)"></i>불량</span></div>
    </div>
    <div id="eqList"></div>
  </div>

  <!-- INSPECTION -->
  <div id="v-eq" class="hide">
    <div class="eq-meta">
      <div class="progress-inline">
        <span class="t" id="eqProgT">0 / 0</span>
        <div class="bar"><i id="eqProgBar" style="width:0%"></i></div>
      </div>
      <div class="fgrid">
        <div class="field"><label>점검자</label><input id="e_inspector" placeholder="소속·성명"></div>
        <div class="field"><label>입회자</label><input id="e_attendee" placeholder="관리주체"></div>
        <div class="field"><label>설치위치</label><input id="e_loc" placeholder="예: 지하 1층 통신실"></div>
        <div class="field"><label>점검일자</label><input id="e_date" type="date"></div>
      </div>
    </div>
    <div id="itemList"></div>
    <div class="action-box">
      <label>부적합 사항 및 조치사항</label>
      <textarea id="e_action" placeholder="부적합 항목의 구체적 내용과 조치사항을 기록하세요."></textarea>
    </div>
    <div class="btn-row no-print">
      <button class="btn ghost" id="allGood"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>모두 양호</button>
      <button class="btn pri" id="doneEq"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>목록으로</button>
    </div>
  </div>

  <!-- REPORT -->
  <div id="v-report" class="hide">
    <div class="rep-summary">
      <div class="head">
        <div>
          <h2 id="r_site">성능점검 결과 보고</h2>
          <div style="font-size:12px;color:var(--ink3);margin-top:3px" id="r_addr"></div>
        </div>
        <div class="date" id="r_date"></div>
      </div>
      <dl class="rep-kv">
        <dt>점검자</dt><dd id="r_inspector">-</dd>
        <dt>입회자</dt><dd id="r_attendee">-</dd>
      </dl>
      <div class="rep-stats">
        <div class="s"><b id="r_total">0</b><span>전체</span></div>
        <div class="s good"><b id="r_good">0</b><span>양호</span></div>
        <div class="s bad"><b id="r_bad">0</b><span>불량</span></div>
        <div class="s non"><b id="r_non">0</b><span>미점검</span></div>
      </div>
    </div>
    <div id="repBody"></div>
  </div>
</div>

<div class="tabbar">
  <button data-tab="dash" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>대시보드</button>
  <button data-tab="report" style="position:relative"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>보고서<span class="nbadge hide" id="tabBadge">0</span></button>
</div>

<!-- menu sheet -->
<div class="sheet-bg" id="menuSheet">
  <div class="sheet">
    <div class="grip"></div>

const KEY='ictInspect.v1';
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state=load();
function blank(){
  return {site:{name:'',addr:'',inspector:'',attendee:'',date:today()},
    eq:DATA.map(e=>({inspector:'',attendee:'',loc:'',date:'',action:'',
      items:e.items.map(()=>({r:null,note:''}))})) };
}
function today(){const d=new Date();return d.toISOString().slice(0,10);}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.eq&&s.eq.length===DATA.length)return s;}catch(e){}
  return blank();
}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
},250);}

/* ---- stats ---- */
function eqStat(i){
  const it=state.eq[i].items;let g=0,b=0;
  it.forEach(x=>{if(x.r==='good')g++;else if(x.r==='bad')b++;});
  return {g,b,done:g+b,total:it.length};
}
function totals(){
  let g=0,b=0,t=0;
  state.eq.forEach((e,i)=>{const s=eqStat(i);g+=s.g;b+=s.b;t+=s.total;});
  return {g,b,t,non:t-g-b,done:g+b};
}

/* ---- dashboard ---- */
function renderDash(){
  const s=state.site;
  $('#f_site').value=s.name;$('#f_addr').value=s.addr;
  $('#f_inspector').value=s.inspector;$('#f_attendee').value=s.attendee;$('#f_date').value=s.date;
  const T=totals();
  $('#progText').textContent=`${T.done} / ${T.t} 항목`;
  $('#cGood').textContent=T.g;$('#cBad').textContent=T.b;$('#cNon').textContent=T.non;
  const pct=T.t?Math.round(T.done/T.t*100):0;
  $('#ringPct').textContent=pct+'%';
  const C=188.5;$('#ringFg').style.strokeDashoffset=C-C*pct/100;
  $('#ringFg').setAttribute('stroke',T.b>0?'#ff9d9d':'#7ee0a8');
  const badge=$('#tabBadge');
  if(T.b>0){badge.textContent=T.b;badge.classList.remove('hide');}else badge.classList.add('hide');

  const box=$('#eqList');box.innerHTML='';
  DATA.forEach((e,i)=>{
    const st=eqStat(i);
    const pc=st.total?Math.round(st.done/st.total*100):0;
    const cls=st.b>0?'hasbad':(st.done===st.total?'done':'');
    const badge=st.b>0?`<span class="badge b">불량 ${st.b}</span>`
      :(st.done===st.total?`<span class="badge d">완료</span>`:'');
    const el=document.createElement('div');
    el.className='eq '+cls;
    el.innerHTML=`<div class="no">${i+1}</div>
      <div class="body">
        <div class="nm">${esc(e.name)}</div>
        <div class="meta">${st.done}/${st.total} 점검 · ${pc}%</div>
        <div class="bar"><i style="width:${pc}%"></i></div>
      </div>
      ${badge}
      <div class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>`;
    el.onclick=()=>openEq(i);
    box.appendChild(el);
  });
}
['f_site|name','f_addr|addr','f_inspector|inspector','f_attendee|attendee','f_date|date']
.forEach(p=>{const[id,k]=p.split('|');
  document.addEventListener('input',ev=>{if(ev.target.id===id){state.site[k]=ev.target.value;save();
    if(k==='inspector'||k==='date') renderDash();}});
});

/* ---- inspection ---- */
let curEq=0;
function openEq(i){
  curEq=i;const e=DATA[i],se=state.eq[i];
  show('eq');
  $('#barTitle').textContent=`${i+1}. ${e.name}`;
  $('#barSub').textContent='성능점검표';
  $('#e_inspector').value=se.inspector||state.site.inspector;
  $('#e_attendee').value=se.attendee||state.site.attendee;
  $('#e_loc').value=se.loc;
  $('#e_date').value=se.date||state.site.date;
  $('#e_action').value=se.action;
  const box=$('#itemList');box.innerHTML='';
  e.items.forEach((it,j)=>{
    const r=se.items[j].r;
    const cls=r==='good'?'good':(r==='bad'?'bad':'');
    const el=document.createElement('div');
    el.className='item '+cls;
    el.innerHTML=`
      <div class="top">
        <div class="qno">항목 ${j+1}</div>
        <div class="q">${esc(it.t)}</div>
        <div class="how"><b>점검방식</b>${esc(it.m)}</div>
      </div>
      <div class="toggle">
        <button class="tg ${r==='good'?'on-good':''}" data-r="good" data-j="${j}">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>양호</button>
        <button class="tg ${r==='bad'?'on-bad':''}" data-r="bad" data-j="${j}">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>불량</button>
      </div>
      <div class="note-in"><input placeholder="비고 (측정값·특이사항)" data-note="${j}" value="${esc(se.items[j].note)}"></div>`;
    box.appendChild(el);
  });
  updateEqProg();
  window.scrollTo(0,0);
}
function updateEqProg(){
  const st=eqStat(curEq);
  $('#eqProgT').textContent=`${st.done} / ${st.total}`;
  $('#eqProgBar').style.width=(st.total?st.done/st.total*100:0)+'%';
}
$('#itemList').addEventListener('click',ev=>{
  const b=ev.target.closest('.tg');if(!b)return;
  const j=+b.dataset.j,r=b.dataset.r,cur=state.eq[curEq].items[j].r;
  state.eq[curEq].items[j].r=(cur===r)?null:r;save();
  const nr=state.eq[curEq].items[j].r;
  const item=b.closest('.item');
  item.classList.toggle('good',nr==='good');
  item.classList.toggle('bad',nr==='bad');
  $$('.tg',item).forEach(t=>{t.classList.remove('on-good','on-bad');
    if(t.dataset.r===nr)t.classList.add(nr==='good'?'on-good':'on-bad');});
  updateEqProg();
});
$('#itemList').addEventListener('input',ev=>{
  const n=ev.target.dataset.note;if(n===undefined)return;
  state.eq[curEq].items[+n].note=ev.target.value;save();
});
[['e_inspector','inspector'],['e_attendee','attendee'],['e_loc','loc'],['e_date','date'],['e_action','action']]
.forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{state.eq[curEq][k]=e.target.value;save();}));
$('#allGood').onclick=()=>{
  state.eq[curEq].items.forEach(x=>{if(x.r===null)x.r='good';});save();openEq(curEq);toast('미점검 항목을 양호 처리했어요');
};
$('#doneEq').onclick=()=>{show('dash');renderDash();$('#barTitle').textContent='정보통신설비 성능점검';$('#barSub').textContent='현장 점검 · 자동 저장';};

/* ---- report ---- */
function renderReport(){
  const s=state.site,T=totals();
  $('#r_site').textContent=s.name?s.name+' 성능점검 결과':'성능점검 결과 보고';
  $('#r_addr').textContent=s.addr||'';
  $('#r_date').innerHTML='점검일자<br>'+(s.date||'-');
  $('#r_inspector').textContent=s.inspector||'-';
  $('#r_attendee').textContent=s.attendee||'-';
  $('#r_total').textContent=T.t;$('#r_good').textContent=T.g;$('#r_bad').textContent=T.b;$('#r_non').textContent=T.non;
  const body=$('#repBody');body.innerHTML='';
  const bads=[];
  state.eq.forEach((se,i)=>se.items.forEach((x,j)=>{if(x.r==='bad')bads.push({eq:DATA[i].name,it:DATA[i].items[j].t,note:x.note,action:se.action});}));
  const h=document.createElement('div');h.className='rep-sec-h';
  h.innerHTML=`불량 항목 <span class="cnt">${bads.length}</span>`;body.appendChild(h);
  if(!bads.length){
    const e=document.createElement('div');e.className='empty';
    e.innerHTML=`<div class="ic">✓</div>불량으로 기록된 항목이 없습니다.`;body.appendChild(e);
  }else{
    bads.forEach(b=>{const c=document.createElement('div');c.className='bad-card';
      c.innerHTML=`<div class="eqn">${esc(b.eq)}</div><div class="it">${esc(b.it)}</div>
        <div class="nt">${b.note?esc(b.note):'<em>비고 없음</em>'}</div>`;body.appendChild(c);});
  }
  // 미점검 설비 요약
  const nonDone=[];
  state.eq.forEach((se,i)=>{const st=eqStat(i);if(st.done<st.total)nonDone.push(`${DATA[i].name} (${st.done}/${st.total})`);});
  const h2=document.createElement('div');h2.className='rep-sec-h';
  h2.innerHTML=`미완료 설비 <span class="cnt" style="background:var(--ink3)">${nonDone.length}</span>`;body.appendChild(h2);
  if(!nonDone.length){const e=document.createElement('div');e.className='empty';e.innerHTML=`<div class="ic">✓</div>모든 설비 점검이 완료되었습니다.`;body.appendChild(e);}
  else{const c=document.createElement('div');c.className='bad-card';c.style.borderLeftColor='var(--ink3)';
    c.innerHTML=nonDone.map(x=>`<div class="nt" style="padding:2px 0">· ${esc(x)}</div>`).join('');body.appendChild(c);}
}

/* ---- nav ---- */
function show(v){
  ['dash','eq','report'].forEach(x=>$('#v-'+x).classList.toggle('hide',x!==v));
  $('#backBtn').style.display=(v==='eq')?'flex':'none';
  if(v==='dash'){$('#barTitle').textContent='정보통신설비 성능점검';$('#barSub').textContent='현장 점검 · 자동 저장';}
  if(v==='report'){$('#barTitle').textContent='성능점검 보고서';$('#barSub').textContent='요약 · 불량 항목';}
  $$('.tabbar button').forEach(b=>b.classList.toggle('on',
    (v==='report'&&b.dataset.tab==='report')||((v==='dash'||v==='eq')&&b.dataset.tab==='dash')));
}
$$('.tabbar button').forEach(b=>b.onclick=()=>{
  const t=b.dataset.tab;
  if(t==='dash'){show('dash');renderDash();}
  else{renderReport();show('report');}
  window.scrollTo(0,0);
});
$('#backBtn').onclick=()=>{show('dash');renderDash();};

/* ---- menu / export ---- */
const sheet=$('#menuSheet');
$('#menuBtn').onclick=()=>sheet.classList.add('on');
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('on');};
function closeSheet(){sheet.classList.remove('on');}
$('#printBtn').onclick=()=>{renderReport();show('report');setTimeout(()=>window.print(),200);};
$('#mPrint').onclick=()=>{closeSheet();renderReport();show('report');setTimeout(()=>window.print(),250);};

function download(name,text,type){
  const b=new Blob([text],{type});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
$('#mJson').onclick=()=>{closeSheet();
  download(`점검백업_${state.site.date||today()}.json`,JSON.stringify(state,null,1),'application/json');
  toast('백업 파일을 저장했어요');};
$('#mCsv').onclick=()=>{closeSheet();
  let rows=[['설비명','No','점검항목','점검결과','비고','설치위치','점검일자']];
  const RT={good:'양호',bad:'불량',null:'미점검'};
  state.eq.forEach((se,i)=>DATA[i].items.forEach((it,j)=>{
    const x=se.items[j];
    rows.push([DATA[i].name,j+1,it.t,x.r?RT[x.r]:'미점검',x.note||'',se.loc||'',se.date||state.site.date||'']);
  }));
  const csv='\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download(`점검결과_${state.site.date||today()}.csv`,csv,'text/csv');
  toast('CSV로 내보냈어요');};
$('#mImport').onclick=()=>{closeSheet();$('#importFile').click();};
$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);
    if(s&&s.eq&&s.eq.length===DATA.length){state=s;save();renderDash();show('dash');toast('백업을 불러왔어요');}
    else toast('형식이 맞지 않는 파일이에요');}catch(err){toast('불러오기에 실패했어요');}};
  rd.readAsText(f);e.target.value='';};
$('#mReset').onclick=()=>{closeSheet();
  if(confirm('모든 점검 기록을 삭제하고 처음 상태로 되돌릴까요?')){
    state=blank();save();renderDash();show('dash');toast('초기화했어요');}};

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1900);}

/* init */
renderDash();
</script>
</body>
</html>
